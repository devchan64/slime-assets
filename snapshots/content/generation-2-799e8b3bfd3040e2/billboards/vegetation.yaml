        status: 원본 이미지 육안 확인
        source_sha256: 4408ada6cea98ec52ff48d96ac7775e02c471c69745652e7d62c25613c3e11b9
      recommended_uses:
      - '작은 낙과 묶음: 과수 아래 수확·낙과 흔적'
      visual_description: 붉은 사과 두 알이 마른 갈색 잎 위에 붙어 있고 왼쪽 열매가 더 크다.
