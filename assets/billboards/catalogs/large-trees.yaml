schema_version: 1
category: large-trees
families:
  orchard-apple-tree:
    name: 사과나무
    uses:
    - 과수 재배 구역의 중심 수목
    category: tree
    features:
    - 열매가 달린 수관과 줄기
    review_category: large-trees
  orchard-dead-tree:
    name: 고사목
    uses:
    - 메마른 구역과 관리되지 않은 가장자리
    category: tree
    features:
    - 잎이 적고 가지가 드러난 나무
    review_category: large-trees
  orchard-autumn-tree:
    name: 가을 과수
    uses:
    - 계절감이 있는 과수 군락
    category: tree
    features:
    - 가을색 수관
    review_category: large-trees
  orchard-young-tree:
    name: 어린 과수
    uses:
    - 어린 나무 재배 구역
    category: tree
    features:
    - 작은 수관과 가는 줄기
    review_category: large-trees
  orchard-old-tree:
    name: 오래된 과수
    uses:
    - 오래된 과수 구역의 중심
    category: tree
    features:
    - 굵은 줄기와 넓은 수관
    review_category: large-trees
  field-root-trail-rooted-tree-1-v1:
    name: 뿌리 오솔길 · 뿌리 나무 · 변형 1/5
    uses:
    - root-trail 야외 필드 배치 후보
    category: tree
    features:
    - 지역별 형태·크기 변형
    review_category: large-trees
  dawn-overlook-pine-tree-windswept-v1:
    name: 바람에 기운 낮은 소나무
    uses:
    - 산지 사면 수목 군락. 높이와 수형을 섞고 전망 중심과 통로를 비운다.
    category: tree
    features:
    - 바람에 기운 낮은 소나무
    - 짙은 녹색 바늘잎과 갈색 줄기, 드러난 짧은 뿌리
    review_category: large-trees
  orchard-young-tree-variant-1-v3:
    name: 잎 무리가 선명한 어린 과수
    uses:
    - 뿌리를 점유 타일 안에 두고 통로와 주변 수관의 가림을 확인한다.
    category: vegetation
    features:
    - 부드러운 손그림 음영
    - 구분되는 잎 무리와 노출된 뿌리
    review_category: large-trees
  dawn-overlook-conifer-tree-tall-v2:
    name: 층진 수관의 높은 침엽수
    uses:
    - 뿌리를 점유 타일 안에 두고 통로와 주변 수관의 가림을 확인한다.
    category: vegetation
    features:
    - 부드러운 손그림 음영
    - 구분되는 잎 무리와 노출된 뿌리
    review_category: large-trees
  dawn-overlook-conifer-tree-medium-v2:
    name: 넓은 수관의 중간 침엽수
    uses:
    - 뿌리를 점유 타일 안에 두고 통로와 주변 수관의 가림을 확인한다.
    category: vegetation
    features:
    - 부드러운 손그림 음영
    - 구분되는 잎 무리와 노출된 뿌리
    review_category: large-trees
  conifer-tree-compact-v1:
    name: 낮고 풍성한 침엽수
    uses:
    - 뿌리를 점유 타일 안에 두고 통로와 주변 수관의 가림을 확인한다.
    category: vegetation
    features:
    - 부드러운 손그림 음영
    - 구분되는 잎 무리와 노출된 뿌리
    review_category: large-trees
  conifer-tree-open-v1:
    name: 가지 사이가 열린 침엽수
    uses:
    - 뿌리를 점유 타일 안에 두고 통로와 주변 수관의 가림을 확인한다.
    category: vegetation
    features:
    - 부드러운 손그림 음영
    - 구분되는 잎 무리와 노출된 뿌리
    review_category: large-trees
billboards:
- texture_key: conifer-tree-compact-v1
  family: conifer-tree-compact-v1
  asset_ref:
    management_id: image.scenery.conifer-tree-compact-v1
    version: v1
  map_references:
  - path: assets/maps/field_tiles/dawn-overlook.yaml
    texture_key_occurrences: 5
  source_file:
    path: assets/billboards/conifer-tree-compact-v1.png
    width: 228
    height: 256
    sha256: b01c40b236e7c80846e77e1b2e4101a360d932f0d13b0b7484ebd1abe6cf08cc
  modeling:
    avoid:
    - 접지 영역의 서로 다른 고도
    - 다른 오브젝트의 접지 점유와 중첩
    - 출입구·시작점·주요 이동로 점유
    basis: 등록 명칭·계열에 근거한 배치 지침. 원본 외형과 지역 설정을 최종 확인한다.
    shadow:
      guidance_only: true
      runtime_profile: billboard-contact-tile-length-v3
      contact_guidance: 줄기·밑동에 접지 그림자를 둔다. 수관 크기의 검은 원이나 긴 투사 그림자를 접지 그림자로 대신하지 않는다.
      placement_review: 타일 고도·상하 앵커·회전에 맞는 접지 위치를 확인하고 절벽 밖이나 다른 오브젝트 위로 그림자가 번지지
        않게 검수한다.
      current_rendering: 공용 렌더러 3겹 접지 그림자. 모든 점유 형태에 타일 열·행 축을 따르는 둥근 직사각형. 공용 속성
        shadowOffsetColumn/Row와 shadowScaleX/Y로 위치·크기를 조절한다. 농도 수동 조절은 미지원.
      baked_shadow_review: 원본에 진한 그림자·지면 받침이 있으면 중복 음영을 확인한다. 원본별 그림자 포함 여부는 이미지 검수로
        확정한다.
    purpose: 낮고 풍성한 침엽수 · 수목 군락
    composition: 크기가 다른 수목을 섞어 군락과 빈터를 만들고 출입구·시작 지점을 비운다.
    recommended_uses:
    - 뿌리를 점유 타일 안에 두고 통로와 주변 수관의 가림을 확인한다.
  placement:
    status: 공용 속성 등록됨
    anchor_semantics: 이미지 사각형 아랫변 중앙의 타일 좌표. (.5,.5)는 중앙. 투명 여백 포함.
    vertical_classification: top
    source: assets/maps/sprite-display-properties.yaml#data.conifer-tree-compact-v1
