    sha256: 03685098f5b3c0cf1fd53a03e08b64e7792cfaa1af47ca12519e606bb7bef33e
  modeling:
    avoid:
    - 접지 영역의 서로 다른 고도
    - 다른 오브젝트의 접지 점유와 중첩
    - 출입구·시작점·주요 이동로 점유
    basis: 등록 명칭·계열에 근거한 배치 지침. 원본 외형과 지역 설정을 최종 확인한다.
    shadow:
      guidance_only: true
      runtime_profile: billboard-contact-v2
      contact_guidance: 줄기 군락 밑에 작고 옅은 접지 그림자를 둔다. 잎 전체를 검은 원으로 채우지 않는다.
      placement_review: 타일 고도·상하 앵커·회전에 맞는 접지 위치를 확인하고 절벽 밖이나 다른 오브젝트 위로 그림자가 번지지
        않게 검수한다.
      current_rendering: 공용 렌더러 3겹 접지 그림자. 정사각 점유는 타원, 열·행 수가 다른 점유는 점유 축을 따르는 둥근
        직사각형. 에셋별 농도 수동 조절은 미지원.
      baked_shadow_review: 원본에 진한 그림자·지면 받침이 있으면 중복 음영을 확인한다. 원본별 그림자 포함 여부는 이미지 검수로
        확정한다.
    purpose: 푸른 야생화 · 꽃·색채 강조
    composition: 식생 군락의 일부에 제한적으로 섞어 색채가 균일하게 반복되지 않도록 한다.
    visual_review:
      date: '2026-10-22'
      scope: 형태·색상·구성·화면상 방향. 정밀 알파 경계와 게임 접지 판정은 별도 검수.
      method: 등록 PNG를 투명도 합성한 축소 검수 시트에서 외형 확인
      status: 원본 이미지 육안 확인
      source_sha256: cdd522651ff79b4f606f7bb9fac823c75a5aaf57d38f3b67ccd2e4c462f129f1
    recommended_uses:
    - 녹지의 차가운 색상 강조
    visual_description: 넓은 녹색 밑잎 위로 짧은 줄기와 작은 푸른 꽃들이 올라온다.
  placement:
    status: 공용 속성 등록됨
    anchor_semantics: 이미지 사각형 아랫변 중앙의 타일 좌표. (.5,.5)는 중앙. 투명 여백 포함.
