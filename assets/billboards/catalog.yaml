    - 고지대 융기 지형의 벽면 아래에 배치하는 석영 노두. 높은 형상은 지형 높이차를 표현하는 벽면용이다.
    composition: 지정 점유 규격에 맞춰 배치하고 불규칙한 외곽 사이에 여백을 둔다. 높은 형은 뒤쪽을 벽면에 가깝게, 낮은 형은 바닥에
