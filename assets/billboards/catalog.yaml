schema_version: 1
description: 등록 빌보드 전체의 외형 계열·배치 용도·원본 및 맵 참조 색인
scope:
  image_count: 241
  includes: assets/billboards/ 아래 등록된 모든 PNG. 이전 버전도 포함한다.
  excludes: 완성형 건물 스프라이트와 바닥 타일은 제외한다.
  reference_snapshot_date: '2026-10-20'
reference_contract:
  asset_registry: asset-registry.yaml
  asset_lookup:
  - management_id -> managementId
  - version -> version
  resolved_fields:
  - path
  - sha256
  - source
  - width
  - height
  map_references: textureKey 직접 참조의 파일별 출현 수이며 화면 표시 수나 런타임 자동 배치를 뜻하지 않는다. 맵 변경 시
    다시 확인한다.
  features: 계열 설명은 등록 명칭·파일 계열과 제작 결과를 기준으로 한다. 변형별 세부 외형은 원본 PNG를 확인한다.
  usage: 권장 시각 용도이며 충돌·통행·상호작용 기능을 부여하지 않는다.
  status: 참조가 없어도 폐기 상태를 뜻하지 않는다. 런타임 카탈로그 및 간접 참조는 별도 확인한다.
  visual_description: modeling.visual_description은 등록 PNG를 직접 확인한 외형 묘사다. 화면상 방향과
    지면 점유 축은 구분하며 실제 점유·앵커는 placement를 따른다. visual_review.source_sha256과 현재 source_file.sha256이
    다르면 다시 검수한다.
placement_guidance:
  tree: 유사 수종을 군락으로 묶고 통행로와 건물 입구를 비운다.
  vegetation: 바닥 재질과 주변 식생에 맞는 계열을 선택하고 빈 공간을 남긴다.
  debris: 관련 수목 주변에 제한적으로 배치한다.
  prop: 건물의 시각적 용도와 관련된 작업 공간에 배치한다.
  scene: 작업 장면의 중심으로 사용하며 같은 기능 소품을 겹쳐 놓지 않는다.
  navigation: 재생·프레임·앵커는 animation 메타데이터를 따른다.
  ground_pairing: 하나의 바닥에 여러 빌보드를 조합할 수 있다. 이 색인은 새 타일 매핑이나 자동 배치 규칙을 적용하지 않는다.
  depth: 실제 앵커·높이·앞/중앙/뒤 배치는 맵과 공용 렌더러가 결정한다.
review_categories:
  vegetation: 자연물
  props: 소품
review_category_guidance: 계열별 review_category를 검수 목록 분류의 기준으로 사용한다. 나무·식물·자연 잔해는 자연물,
  작업 도구·안내 표시는 소품이다.
