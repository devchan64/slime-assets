schema_version: 2
description: 등록 빌보드 전체의 외형 계열·배치 용도·원본 및 맵 참조 색인
scope:
  image_count: 270
  includes: assets/billboards/ 아래 등록된 모든 PNG. 이전 버전도 포함한다.
  excludes: 완성형 건물 스프라이트와 바닥 타일은 제외한다.
  reference_snapshot_date: '2026-10-20'
reference_contract:
  asset_registry: asset-registry.yaml
  asset_lookup:
  - management_id -> managementId
  - version -> version
  resolved_fields:
  - path
  - sha256
  - source
  - width
  - height
  map_references: textureKey 직접 참조의 파일별 출현 수이며 화면 표시 수나 런타임 자동 배치를 뜻하지 않는다. 맵 변경 시
    다시 확인한다.
  features: 계열 설명은 등록 명칭·파일 계열과 제작 결과를 기준으로 한다. 변형별 세부 외형은 원본 PNG를 확인한다.
  usage: 권장 시각 용도이며 충돌·통행·상호작용 기능을 부여하지 않는다.
  status: 참조가 없어도 폐기 상태를 뜻하지 않는다. 런타임 카탈로그 및 간접 참조는 별도 확인한다.
  visual_description: modeling.visual_description은 등록 PNG를 직접 확인한 외형 묘사다. 화면상 방향과
    지면 점유 축은 구분하며 실제 점유·앵커는 placement를 따른다. visual_review.source_sha256과 현재 source_file.sha256이
    다르면 다시 검수한다.
placement_guidance:
  tree: 유사 수종을 군락으로 묶고 통행로와 건물 입구를 비운다.
  vegetation: 바닥 재질과 주변 식생에 맞는 계열을 선택하고 빈 공간을 남긴다.
  debris: 관련 수목 주변에 제한적으로 배치한다.
  prop: 건물의 시각적 용도와 관련된 작업 공간에 배치한다.
  scene: 작업 장면의 중심으로 사용하며 같은 기능 소품을 겹쳐 놓지 않는다.
  navigation: 재생·프레임·앵커는 animation 메타데이터를 따른다.
  ground_pairing: 하나의 바닥에 여러 빌보드를 조합할 수 있다. 이 색인은 새 타일 매핑이나 자동 배치 규칙을 적용하지 않는다.
  depth: 실제 앵커·높이·앞/중앙/뒤 배치는 맵과 공용 렌더러가 결정한다.
review_categories:
  herbaceous: 화초
  large-trees: 큰 나무
  props: 소품
  rocks-minerals: 암석광물
  vegetation: 자연물
review_category_guidance: 계열별 review_category를 검수 목록 분류의 기준으로 사용한다. 큰 나무는 large-trees,
  꽃·풀·잎·갈대·덩굴은 herbaceous, 나머지 식물·자연 잔해는 vegetation, 작업 도구·안내 표시는 props다. 큰 나무는 검수로
  지정한 계열이며 표시 높이를 바꿔도 자동 재분류하지 않는다.
modeling_contract:
  purpose: 맵 제작용 에셋 선택·크기·접지·통행 참고 자료
  authoritative_properties: assets/maps/sprite-display-properties.yaml
  derived_fields:
  - source_file
  - placement
  - map_references
  editable_guidance: modeling은 수동 보강한다. 동기화는 기존 설명을 덮어쓰지 않는다.
  display_height: displayHeight는 공용 기준 높이(px). PNG 해상도와 다르다.
  outdoor_scale: 0.5
  outdoor_height: outdoorDisplayHeight는 야외필드 배율 적용 후 높이이며 화면 줌은 포함하지 않는다.
  footprint: 기준 타일부터 열·행 증가 방향으로만 확장한다. 실제 점유 칸 수는 선언 열 수×행 수이며 2×1은 정확히 2칸이다.
  blocking: 열·행이 모두 3 이상이면 외곽 한 줄을 제외한 내부 (열-2)×(행-2) 타일만 자동 차단한다. 기준 교차점 거리는 축별 1칸=0.5,
    그 외 칸수-1이다. 앵커 X·Y는 이 교차점에서 이미지 아랫변 중심까지의 수동 이동값이다.
  missing: 설정 필요 항목은 크기를 추측하여 배치하지 않는다.
  shadow:
    profile: billboard-contact-tile-length-v3
    implementation: '@slime/field-renderer 1.0.142 · drawBillboardContactShadow'
    enabled: 기본 활성화. 렌더러 옵션 billboardShadows=false로 전체 비활성화.
    geometry: 열 길이=점유 열×shadowScaleX타일, 행 길이=점유 행×shadowScaleY타일(shadowSizeVersion=2).
      모든 점유 형태에서 모서리 반경=짧은 반축×0.35인 둥근 직사각형을 지면에 투영한다. 표시 높이·이미지 여백과 무관하며 2×3 점유에서
      1·1은 전체 2×3칸을 채운다.
    layers:
    - scale: 1
      alpha: 0.14
    - scale: 0.78
      alpha: 0.2
    - scale: 0.5
      alpha: 0.26
    color: '#18201b'
    position: 'tile-intersection의 그림자 이동 0·0은 기준 교차점이다. 수동 이미지 앵커와 독립적이다. 빌보드 앵커의
      화면 이동을 제거한다: X 보정=(column-row)×tileWidth×0.5, Y 보정=(column+row)×tileHeight×0.5를
      뺀다. 열·행 오프셋은 카메라 회전을 반영한다.'
    depth: 소속 타일의 지면 바로 위에 배치하며 빌보드·캐릭터 정렬과 분리한다.
    limits: 접지 그림자만 지원. 광원 방향의 투사·실루엣 그림자, 에셋별 농도 설정, 지면 경계 클리핑은 지원하지 않는다.
    catalog_role: modeling.shadow는 제작·검수 지침이다. 이 지침만 편집해도 런타임은 바뀌지 않는다. 위치·크기는 공용
      속성 편집기에서 shadowOffsetColumn/Row(-4~4타일), shadowScaleX/Y(점유 열·행 배율 0.001~4),
      1은 해당 점유 축 전체이며 표시 높이는 크기에 곱하지 않음를 저장한다.
  validation: slime-workflow/tools/review/maintenance/sync_billboard_catalog.py --check
catalog_files:
  herbaceous: catalogs/herbaceous.yaml
  large-trees: catalogs/large-trees.yaml
  props: catalogs/props.yaml
  rocks-minerals: catalogs/rocks-minerals.yaml
  vegetation: catalogs/vegetation.yaml
