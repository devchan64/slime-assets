modeling_contract:
  purpose: 맵 제작용 에셋 선택·크기·접지·통행 참고 자료
  authoritative_properties: assets/maps/sprite-display-properties.yaml
  derived_fields:
  - source_file
  - placement
  - map_references
  editable_guidance: modeling은 수동 보강한다. 동기화는 기존 설명을 덮어쓰지 않는다.
  display_height: displayHeight는 공용 기준 높이(px). PNG 해상도와 다르다.
  outdoor_scale: 0.5
  outdoor_height: outdoorDisplayHeight는 야외필드 배율 적용 후 높이이며 화면 줌은 포함하지 않는다.
  footprint: 기준 타일부터 열·행 증가 방향으로만 확장한다. 실제 점유 칸 수는 선언 열 수×행 수이며 2×1은 정확히 2칸이다.
  blocking: 열·행이 모두 3 이상이면 외곽 한 줄을 제외한 내부 (열-2)×(행-2) 타일만 자동 차단한다. 기준 교차점 거리는 축별 1칸=0.5,
    그 외 칸수-1이다. 앵커 X·Y는 이 교차점에서 이미지 아랫변 중심까지의 수동 이동값이다.
  missing: 설정 필요 항목은 크기를 추측하여 배치하지 않는다.
  shadow:
    profile: billboard-contact-tile-length-v3
    implementation: '@slime/field-renderer 1.0.142 · drawBillboardContactShadow'
    enabled: 기본 활성화. 렌더러 옵션 billboardShadows=false로 전체 비활성화.
    geometry: 열 길이=shadowScaleX타일, 행 길이=shadowScaleY타일. 모든 점유 형태에서 모서리 반경=짧은 반축×0.35인
      둥근 직사각형을 지면에 투영한다. 표시 높이·이미지 여백과 무관하며 2×1 점유는 2·1로 설정한다.
    layers:
    - scale: 1
      alpha: 0.14
    - scale: 0.78
      alpha: 0.2
    - scale: 0.5
      alpha: 0.26
    color: '#18201b'
    position: 'tile-intersection의 그림자 이동 0·0은 기준 교차점이다. 수동 이미지 앵커와 독립적이다. 빌보드 앵커의
      화면 이동을 제거한다: X 보정=(column-row)×tileWidth×0.5, Y 보정=(column+row)×tileHeight×0.5를
      뺀다. 열·행 오프셋은 카메라 회전을 반영한다.'
    depth: 소속 타일의 지면 바로 위에 배치하며 빌보드·캐릭터 정렬과 분리한다.
    limits: 접지 그림자만 지원. 광원 방향의 투사·실루엣 그림자, 에셋별 농도 설정, 지면 경계 클리핑은 지원하지 않는다.
    catalog_role: modeling.shadow는 제작·검수 지침이다. 이 지침만 편집해도 런타임은 바뀌지 않는다. 위치·크기는 공용
      속성 편집기에서 shadowOffsetColumn/Row(-4~4타일), shadowScaleX(열 길이 0.1~4타일), shadowScaleY(행
      길이 0.05~4타일), 1은 한 칸이며 점유 수와 이미지 높이를 다시 곱하지 않음를 저장한다.
  validation: slime-workflow/tools/review/maintenance/sync_billboard_catalog.py --check
